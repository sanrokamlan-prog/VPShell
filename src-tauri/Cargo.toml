[package]
name = "vpshell"
version = "0.1.0-alpha.9"
description = "A fast cross-platform SSH operations workspace"
authors = ["sanrokamlan-prog"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sanrokamlan-prog/VPShell"
homepage = "https://github.com/sanrokamlan-prog/VPShell"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vpshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
base64 = "0.23.0"
uuid = { version = "1.24.0", features = ["v4"] }
des = "0.9.0"
md-5 = "0.11.0"
keyring = "4.1.5"
zeroize = "1.9.0"
tauri-plugin-dialog = "2.7.2"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rsa", "encryption", "getrandom"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
tar = ">=0.4.46, <0.5"
zstd = "0.13.3"
sha2 = "0.10.9"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "=0.12.4", default-features = false }
getrandom = { version = "=0.3.4", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false }
percent-encoding = { version = "=2.3.2", default-features = false }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.0"
tauri-plugin-biometric = "=2.3.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
russh = { version = "=0.62.7", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=2.4.0"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
