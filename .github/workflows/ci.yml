name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          packages=(
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            mosh
            openssh-server
            patchelf
          )
          for attempt in 1 2 3; do
            if sudo timeout 2m apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          for attempt in 1 2; do
            if sudo timeout 15m env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              -o DPkg::Lock::Timeout=60 \
              -o Dpkg::Use-Pty=0 \
              install -y --no-install-recommends --download-only "${packages[@]}"; then
              break
            fi
            if [[ "$attempt" == 2 ]]; then
              exit 1
            fi
            sleep 5
          done
          sudo timeout 5m env DEBIAN_FRONTEND=noninteractive apt-get \
            -o DPkg::Lock::Timeout=60 \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends --no-download "${packages[@]}"
      - name: Set up real OpenSSH/SFTP native-engine fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          JUMP_KEY="$RUNNER_TEMP/vpshell-native-jump-key"
          TARGET_KEY="$RUNNER_TEMP/vpshell-native-target-key"
          TARGET_HOST_KEY="$RUNNER_TEMP/vpshell-native-target-host-key"
          ssh-keygen -q -t ed25519 -N '' -f "$JUMP_KEY"
          ssh-keygen -q -t ed25519 -N '' -f "$TARGET_KEY"
          ssh-keygen -q -t ed25519 -N '' -f "$TARGET_HOST_KEY"
          sudo chown root:root "$TARGET_HOST_KEY"
          sudo useradd --create-home --shell /bin/sh vpshell-jump-ci
          sudo useradd --create-home --shell /bin/sh vpshell-ci
          sudo passwd -d vpshell-jump-ci
          sudo passwd -d vpshell-ci
          sudo install -d -m 700 -o vpshell-jump-ci -g vpshell-jump-ci /home/vpshell-jump-ci/.ssh
          sudo install -m 600 -o vpshell-jump-ci -g vpshell-jump-ci "$JUMP_KEY.pub" /home/vpshell-jump-ci/.ssh/authorized_keys
          sudo install -d -m 700 -o vpshell-ci -g vpshell-ci /home/vpshell-ci/.ssh
          sudo install -m 600 -o vpshell-ci -g vpshell-ci "$TARGET_KEY.pub" /home/vpshell-ci/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd \
            -p 22223 \
            -o ListenAddress=127.0.0.1 \
            -o HostKey="$TARGET_HOST_KEY" \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o PubkeyAuthentication=yes \
            -o PermitRootLogin=no \
            -o AllowUsers=vpshell-ci \
            -o AllowTcpForwarding=yes \
            -o PermitOpen=127.0.0.1:22223 \
            -o PermitListen=127.0.0.1:* \
            -o GatewayPorts=no \
            -o AllowAgentForwarding=no \
            -o X11Forwarding=no \
            -o UsePAM=no \
            -o PidFile="$RUNNER_TEMP/vpshell-native-target-sshd.pid"
          sudo /usr/sbin/sshd \
            -p 22222 \
            -o ListenAddress=127.0.0.1 \
            -o HostKey=/etc/ssh/ssh_host_ed25519_key \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o PubkeyAuthentication=yes \
            -o PermitRootLogin=no \
            -o AllowUsers=vpshell-jump-ci \
            -o AllowTcpForwarding=yes \
            -o PermitOpen=127.0.0.1:22223 \
            -o AllowAgentForwarding=no \
            -o X11Forwarding=no \
            -o UsePAM=no \
            -o PidFile="$RUNNER_TEMP/vpshell-native-jump-sshd.pid"
          for attempt in {1..20}; do
            if ssh-keyscan -T 1 -p 22222 -t ed25519 127.0.0.1 >/dev/null 2>&1 \
              && ssh-keyscan -T 1 -p 22223 -t ed25519 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              exit 1
            fi
            sleep 1
          done
          TARGET_HOST_KEY_SHA256="$(ssh-keygen -lf "$TARGET_HOST_KEY.pub" -E sha256 | awk '{print $2}')"
          JUMP_HOST_KEY_SHA256="$(ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | awk '{print $2}')"
          install -d -m 700 "$HOME/.ssh"
          awk '{print "[127.0.0.1]:22223 "$1" "$2}' "$TARGET_HOST_KEY.pub" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "VPSHELL_NATIVE_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_PORT=22223" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_USER=vpshell-ci" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_IDENTITY_FILE=$TARGET_KEY" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_HOST_KEY_SHA256=$TARGET_HOST_KEY_SHA256" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_JUMP_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_JUMP_PORT=22222" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_JUMP_USER=vpshell-jump-ci" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_JUMP_IDENTITY_FILE=$JUMP_KEY" >> "$GITHUB_ENV"
          echo "VPSHELL_NATIVE_TEST_JUMP_HOST_KEY_SHA256=$JUMP_HOST_KEY_SHA256" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  android-preview:
    name: Android Preview (aarch64 debug)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-aarch64
      - run: npm ci
      - name: Validate committed Cargo.lock
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Build aarch64 debug APK and run Gradle unit gate
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ln -sf llvm-ar "$NDK_BIN/aarch64-linux-android-ar"
          ln -sf llvm-ranlib "$NDK_BIN/aarch64-linux-android-ranlib"
          ln -sf llvm-nm "$NDK_BIN/aarch64-linux-android-nm"
          export PATH="$NDK_BIN:$PATH"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK_BIN/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          npm run tauri -- android build --apk --debug --target aarch64
          src-tauri/gen/android/gradlew --project-dir src-tauri/gen/android testArm64DebugUnitTest
