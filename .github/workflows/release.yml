name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag reference
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const semverTag = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            if (!tag || !semverTag.test(tag)) {
              core.setFailed(`Release input must be a SemVer tag such as v0.1.0-alpha.1; received ${tag || '<empty>'}.`);
              return;
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Tag refs/tags/${tag} does not exist.`);
                return;
              }
              throw error;
            }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and project versions
        id: metadata
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const fs = require('node:fs');

            const tag = process.env.RELEASE_TAG;
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

            if (!tag || tag !== `v${tauri.version}`) {
              core.setFailed(`Release tag must be v${tauri.version}; received ${tag || '<empty>'}.`);
              return;
            }
            if (packageJson.version !== tauri.version || cargoVersion !== tauri.version) {
              core.setFailed(
                `Version mismatch: tauri=${tauri.version}, npm=${packageJson.version}, cargo=${cargoVersion || '<missing>'}.`,
              );
              return;
            }

            core.setOutput('tag', tag);
            core.setOutput('version', tauri.version);

      - name: Check updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "The Tauri updater signing secrets are not configured." >&2
            exit 1
          fi

      - name: Create or reuse the draft release
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        with:
          result-encoding: string
          script: |
            const fs = require('node:fs');

            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
            const sectionHeading = `## [${version}]`;
            const sectionStart = changelog.indexOf(sectionHeading);
            if (sectionStart === -1) {
              core.setFailed(`CHANGELOG.md has no ${sectionHeading} section.`);
              return;
            }
            const nextSection = changelog.indexOf('\n## [', sectionStart + sectionHeading.length);
            const changelogSection = changelog
              .slice(sectionStart, nextSection === -1 ? changelog.length : nextSection)
              .trim();
            const releaseBody = [
              '> [!WARNING]',
              `> ${tag} is a technical preview. The SemVer suffix marks it as unstable even though GitHub metadata remains a full release so the signed updater can use /releases/latest.`,
              '',
              changelogSection,
              '',
              '## Install and verify',
              '',
              '- All installers are built on their matching GitHub-hosted runner.',
              '- Verify downloads against `SHA256SUMS`; updater payloads also carry Tauri signatures.',
              '- Windows installers are not Authenticode-signed. macOS artifacts use ad-hoc signing and are not notarized.',
              '- Review `THIRD_PARTY_NOTICES.md` and the source lockfiles for dependency and license details.',
            ].join('\n');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((release) => release.tag_name === tag);

            if (existing) {
              if (!existing.draft) {
                core.setFailed(`Release ${tag} is already published; refusing to replace its assets.`);
                return;
              }
              const staleAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                per_page: 100,
              });
              for (const asset of staleAssets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                name: `VPShell ${tag}`,
                body: releaseBody,
                draft: true,
                prerelease: false,
              });
              core.info(`Reusing draft release ${tag} (${existing.id}).`);
              return String(existing.id);
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `VPShell ${tag}`,
              body: releaseBody,
              draft: true,
              // GitHub excludes prereleases from /releases/latest. The SemVer suffix
              // still identifies this build as alpha while keeping the updater URL valid.
              prerelease: false,
            });
            return String(release.id);

  package:
    name: Package ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action updates latest.json with a read/delete/upload sequence. Serializing
      # these jobs prevents two platforms from overwriting each other's updater entry.
      max-parallel: 1
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libappindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign, and upload native bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseBody: |
            Cross-platform technical preview. Review the release notes and known limitations before use.

            This preview uses the system OpenSSH client. Windows installers are not Authenticode-signed and macOS artifacts use ad-hoc signing. Optional FinalShell passwords and private-key passphrases are stored only in the OS keyring; private-key files stay at the user-selected local path. Encrypted cross-device credential sync is not implemented.
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    name: Verify and publish release
    needs: [prepare, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify installers and updater manifest, then publish
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');

            const releaseId = Number(process.env.RELEASE_ID);
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            if (!Number.isSafeInteger(releaseId)) {
              throw new Error(`Invalid release id: ${process.env.RELEASE_ID}`);
            }
            const toBuffer = (data, label) => {
              if (Buffer.isBuffer(data)) return data;
              if (data instanceof ArrayBuffer) return Buffer.from(data);
              if (ArrayBuffer.isView(data)) {
                return Buffer.from(data.buffer, data.byteOffset, data.byteLength);
              }
              if (typeof data === 'string') return Buffer.from(data, 'utf8');
              throw new Error(`Unexpected response type while downloading ${label}.`);
            };

            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            if (!release.draft || release.tag_name !== tag) {
              throw new Error(`Expected an unpublished draft for ${tag}.`);
            }

            const initialAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const existingNotice = initialAssets.find((asset) => asset.name === 'THIRD_PARTY_NOTICES.md');
            if (existingNotice) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existingNotice.id,
              });
            }
            const noticeBytes = fs.readFileSync('THIRD_PARTY_NOTICES.md');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'THIRD_PARTY_NOTICES.md',
              label: 'Third-party notices',
              headers: {
                'content-type': 'text/markdown; charset=utf-8',
                'content-length': noticeBytes.length,
              },
              data: noticeBytes,
            });

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const names = assets.map((asset) => asset.name);
            const requireAsset = (label, predicate) => {
              if (!names.some(predicate)) {
                throw new Error(`Missing ${label} release asset. Found: ${names.join(', ')}`);
              }
            };

            requireAsset('Windows NSIS installer', (name) => /-setup\.exe$/i.test(name));
            requireAsset('Windows MSI installer', (name) => /\.msi$/i.test(name));
            requireAsset('Linux AppImage', (name) => /\.AppImage$/.test(name));
            requireAsset('Linux DEB package', (name) => /\.deb$/i.test(name));
            requireAsset('macOS Apple Silicon DMG', (name) => /_aarch64\.dmg$/i.test(name));
            requireAsset('macOS Intel DMG', (name) => /_x64\.dmg$/i.test(name));

            const latestAsset = assets.find((asset) => asset.name === 'latest.json');
            if (!latestAsset) {
              throw new Error('Missing latest.json updater manifest.');
            }
            const response = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: latestAsset.id,
                headers: { accept: 'application/octet-stream' },
              },
            );
            const manifest = JSON.parse(toBuffer(response.data, 'latest.json').toString('utf8'));
            if (manifest.version !== version) {
              throw new Error(`Updater version mismatch: expected ${version}, got ${manifest.version}.`);
            }

            const requiredPlatforms = [
              'windows-x86_64',
              'linux-x86_64',
              'darwin-aarch64',
              'darwin-x86_64',
            ];
            for (const platform of requiredPlatforms) {
              const entry = manifest.platforms?.[platform];
              if (
                !entry ||
                typeof entry.url !== 'string' ||
                !entry.url.startsWith('https://') ||
                typeof entry.signature !== 'string' ||
                entry.signature.length < 20
              ) {
                throw new Error(`Updater manifest is missing a valid ${platform} entry.`);
              }
            }

            const checksumCandidates = assets
              .filter((asset) => asset.name !== 'SHA256SUMS')
              .sort((left, right) => left.name < right.name ? -1 : left.name > right.name ? 1 : 0);
            if (checksumCandidates.length === 0) {
              throw new Error('No release assets are available for SHA-256 checksums.');
            }

            const checksumLines = [];
            for (const asset of checksumCandidates) {
              if (/[\r\n]/.test(asset.name)) {
                throw new Error(`Release asset has an invalid filename: ${JSON.stringify(asset.name)}.`);
              }
              const assetResponse = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                  headers: { accept: 'application/octet-stream' },
                },
              );
              const digest = crypto
                .createHash('sha256')
                .update(toBuffer(assetResponse.data, asset.name))
                .digest('hex');
              checksumLines.push(`${digest}  ${asset.name}`);
              core.info(`Hashed ${asset.name}.`);
            }
            const checksumContent = `${checksumLines.join('\n')}\n`;
            const checksumBytes = Buffer.from(checksumContent, 'utf8');

            const existingChecksum = assets.find((asset) => asset.name === 'SHA256SUMS');
            if (existingChecksum) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existingChecksum.id,
              });
            }
            const { data: checksumAsset } = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'SHA256SUMS',
              label: 'SHA256SUMS',
              headers: {
                'content-type': 'text/plain; charset=utf-8',
                'content-length': checksumBytes.length,
              },
              data: checksumBytes,
            });

            const checksumResponse = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: checksumAsset.id,
                headers: { accept: 'application/octet-stream' },
              },
            );
            const uploadedChecksum = toBuffer(checksumResponse.data, 'SHA256SUMS').toString('utf8');
            if (uploadedChecksum !== checksumContent) {
              throw new Error('Uploaded SHA256SUMS content does not match the generated checksum list.');
            }
            const finalAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            if (!finalAssets.some((asset) => asset.id === checksumAsset.id && asset.name === 'SHA256SUMS')) {
              throw new Error('SHA256SUMS was not found in the draft release after upload.');
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: `VPShell ${tag}`,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });

            await core.summary
              .addHeading(`Published VPShell ${tag}`)
              .addRaw(
                `Verified ${finalAssets.length} assets, ${requiredPlatforms.length} updater targets, and ${checksumCandidates.length} SHA-256 entries.`,
              )
              .write();
