name: 缺陷报告
description: 报告 VPShell Alpha 中可复现的崩溃、错误或兼容性问题
title: "[Bug] "
labels:
  - bug
  - alpha-feedback
body:
  - type: markdown
    attributes:
      value: |
        感谢参与 VPShell Alpha 测试。请先删除密码、私钥、Token、生产 IP、主机名和敏感终端内容。
        凭据泄露、命令注入、主机密钥绕过或更新完整性等安全问题，请使用 GitHub 私密漏洞报告，不要提交公开 Issue。

  - type: dropdown
    id: version
    attributes:
      label: VPShell 版本
      options:
        - 0.1.0-alpha.1
        - main 分支自行构建
        - 其他版本（请在补充信息中说明）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options:
        - 安装、启动或升级
        - SSH 终端或认证
        - ProxyJump 跳板机
        - 主机概况或最近连接
        - SFTP 浏览、上传或下载
        - 打包传输
        - 外部编辑
        - FinalShell 导入
        - SSH 密钥
        - 命令、脚本或多终端广播
        - 路由追踪、HTTP 或 UDP 测速
        - 设置、背景或字体
        - 其他
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - P0 - 数据丢失、安全风险、错误目标或完全无法启动
        - P1 - 核心功能不可用或崩溃且无法绕过
        - P2 - 功能错误但有绕过办法
        - P3 - 界面、文案或体验问题
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 本机环境
      description: 操作系统版本、架构、系统语言和安装包类型
      placeholder: Windows 11 24H2 x64，简体中文，NSIS setup.exe
    validations:
      required: true

  - type: input
    id: ssh
    attributes:
      label: SSH 与远端环境
      description: 请脱敏，只写 OpenSSH 版本、远端系统、认证和连接方式
      placeholder: OpenSSH_for_Windows_9.x；Debian 12；Ed25519；直连
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 复现频率
      options:
        - 每次必现
        - 经常出现
        - 偶尔出现
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动 VPShell 开始，使用编号步骤写出最短复现过程
      placeholder: |
        1. 打开 VPShell
        2. 新建一个直连测试主机
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包含准确错误文字；不要粘贴凭据或未脱敏的完整终端记录
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的截图、日志或补充信息
      description: 可以直接拖入截图。请先遮盖 IP、主机名、用户名、路径中的身份信息和所有秘密。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已阅读 Alpha 测试指南并确认这不是已列出的限制。
          required: true
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我已删除密码、私钥、Token、生产 IP、主机名和敏感终端内容。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
