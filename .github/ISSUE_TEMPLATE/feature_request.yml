name: 功能建议
description: 提议一个适合 VPShell 产品边界的新能力或工作流改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述实际运维场景、当前做法和痛点，不要只写功能名称
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的操作流程、输入、输出和必要的安全确认
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 目前使用什么 SSH 工具、命令或脚本解决此问题

  - type: dropdown
    id: scope
    attributes:
      label: 主要模块
      options:
        - SSH 终端与跳板机
        - SFTP 与文件编辑
        - 多终端与命令历史
        - 命令库与脚本中心
        - 迁移、密钥与凭据
        - 加密同步
        - 网络诊断与线路
        - 界面、设置与可访问性
        - 安装、升级与发布
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索路线图和现有 Issue，没有找到相同建议。
          required: true
        - label: 此建议不要求静默执行远程命令、绕过主机指纹或上传明文凭据。
          required: true
